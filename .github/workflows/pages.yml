name: Publish site with latest events and projects

on:
  push:
  workflow_dispatch:
  schedule:
    # 3時間ごと。connpassとGitHubの公開情報を取得して公開する。
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test data importers
        run: python3 -m unittest discover -s tests
      - name: Import connpass events and prepare public files
        run: python3 scripts/update_events.py --require-fresh --output _site
      - name: Import GitHub projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_projects.py --require-fresh --output _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
